name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck and bats
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats
      - name: shellcheck (installer and the scripts it generates)
        run: bash tests/lint.sh
      - name: bats
        run: bats tests
